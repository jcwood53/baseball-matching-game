<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Baseball Field Explorer</title>
<style>
  body {font-family:Georgia,serif;background:#f4fbf7;color:#13353a;display:flex;justify-content:center;padding:16px;margin:0;}
  .wrap {width:100%;max-width:1200px;background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(10,25,30,0.12);padding:14px;}
  h1 {margin:0 0 6px 0;font-size:22px;color:#0d3c55;}
  svg {width:100%;height:auto;display:block;}
  a.hotspot:focus {outline:3px solid rgba(47,140,87,0.25);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Baseball Field Explorer</h1>
  <p>Click any position on the field to learn more. Use the text list below if hotspots are difficult to tap.</p>

  <svg viewBox="0 0 1800 2000" role="img" aria-label="Baseball field diagram with hotspots">
    <!-- Background -->
    <rect x="0" y="0" width="1800" height="2000" fill="#2f8c57"/>

    <!-- Infield dirt -->
    <g transform="translate(900,900)">
      <path d="M0 -720 L720 0 L0 720 L-720 0 Z" fill="#d6a770" stroke="#b07a49" stroke-width="2"/>

      <!-- Bases -->
      <a class="hotspot" href="https://canvas.instructure.com/courses/13480398/pages/position-3-1st-base-1b" tabindex="0" aria-label="First Base">
        <rect x="660" y="-60" width="120" height="120" rx="8" fill="#fff" stroke="#c6c6c6" stroke-width="6"/>
        <text x="720" y="8" font-size="36" text-anchor="middle" fill="#000" font-weight="700">1B</text>
      </a>

      <a class="hotspot" href="https://canvas.instructure.com/courses/13480398/pages/position-4-2nd-base-2b" tabindex="0" aria-label="Second Base">
        <rect x="-60" y="-780" width="120" height="120" rx="8" fill="#fff" stroke="#c6c6c6" stroke-width="6"/>
        <text x="0" y="-712" font-size="36" text-anchor="middle" fill="#000" font-weight="700">2B</text>
      </a>

      <a class="hotspot" href="https://canvas.instructure.com/courses/13480398/pages/position-5-3rd-base-3b" tabindex="0" aria-label="Third Base">
        <rect x="-780" y="-60" width="120" height="120" rx="8" fill="#fff" stroke="#c6c6c6" stroke-width="6"/>
        <text x="-720" y="8" font-size="36" text-anchor="middle" fill="#000" font-weight="700">3B</text>
      </a>

      <a class="hotspot" href="https://canvas.instructure.com/courses/13480398/pages/position-2-catcher-c" tabindex="0" aria-label="Home Plate">
        <polygon points="-52,720 52,720 52,684 0,648 -52,684" fill="#fff" stroke="#c6c6c6" stroke-width="4"/>
      </a>

      <!-- Pitcher -->
      <a class="hotspot" href="https://canvas.instructure.com/courses/13480398/pages/position-1-pitcher-p" tabindex="0" aria-label="Pitcher">
        <circle cx="0" cy="100" r="92" fill="#b97f4f" stroke="#9b6237" stroke-width="6"/>
      </a>
    </g>

    <!-- Outfield hotspots -->
    <a class="hotspot" href="https://canvas.instructure.com/courses/13480398/pages/position-7-left-field-lf" tabindex="0" aria-label="Left Field">
      <rect x="280" y="250" width="160" height="60" fill="#ffffffaa" stroke="#0d3c55" stroke-width="2"/>
      <text x="360" y="290" font-size="20" text-anchor="middle" fill="#0d3c55" font-weight="700">Left Field</text>
    </a>

    <a class="hotspot" href="https://canvas.instructure.com/courses/13480398/pages/position-8-center-field-cf" tabindex="0" aria-label="Center Field">
      <rect x="820" y="50" width="160" height="60" fill="#ffffffaa" stroke="#0d3c55" stroke-width="2"/>
      <text x="900" y="90" font-size="20" text-anchor="middle" fill="#0d3c55" font-weight="700">Center Field</text>
    </a>

    <a class="hotspot" href="https://canvas.instructure.com/courses/13480398/pages/position-9-right-field-rf" tabindex="0" aria-label="Right Field">
      <rect x="1360" y="250" width="160" height="60" fill="#ffffffaa" stroke="#0d3c55" stroke-width="2"/>
      <text x="1440" y="290" font-size="20" text-anchor="middle" fill="#0d3c55" font-weight="700">Right Field</text>
    </a>
  </svg>

  <!-- Fallback text navigation -->
  <div style="margin-top:20px;padding:12px;background:#f8f9fa;border-left:6px solid #839192;border-radius:8px;">
    <strong>Text Navigation:</strong>
    <ul style="margin:8px 0 0 18px;line-height:1.6;">
      <li><a href="https://canvas.instructure.com/courses/13480398/pages/position-1-pitcher-p">Pitcher</a></li>
      <li><a href="https://canvas.instructure.com/courses/13480398/pages/position-2-catcher-c">Catcher</a></li>
      <li><a href="https://canvas.instructure.com/courses/13480398/pages/position-3-1st-base-1b">First Base</a></li>
      <li><a href="https://canvas.instructure.com/courses/13480398/pages/position-4-2nd-base-2b">Second Base</a></li>
      <li><a href="https://canvas.instructure.com/courses/13480398/pages/position-5-3rd-base-3b">Third Base</a></li>
      <li><a href="https://canvas.instructure.com/courses/13480398/pages/position-6-shortstop-ss">Shortstop</a></li>
      <li><a href="https://canvas.instructure.com/courses/13480398/pages/position-7-left-field-lf">Left Field</a></li>
      <li><a href="https://canvas.instructure.com/courses/13480398/pages/position-8-center-field-cf">Center Field</a></li>
      <li><a href="https://canvas.instructure.com/courses/13480398/pages/position-9-right-field-rf">Right Field</a></li>
    </ul>
  </div>
</div>
</body>
</html>
